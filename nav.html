<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .main{
            height: 60px;
            width: 1500px;
            border: 2px solid white;
            display: flex;

        }
        p{

            /* border: 2px solid; */
        }
         .item1{

            height: 70%;

    <div class="main">
